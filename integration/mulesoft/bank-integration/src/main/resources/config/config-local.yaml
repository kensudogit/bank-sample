# ローカル（docker compose）向けの設定。環境ごとに config-<env>.yaml を用意し、-Denv=<env> で切り替える。
# パスワード類はこのファイルに書かない。core.password は実行時に -Dcore.password=... または
# Secure Properties（暗号化した config-<env>.secure.yaml）で渡す。
http:
  listener:
    host: "0.0.0.0"
    port: "8081"

core:
  # 勘定系 API（Liberty）。社内ネットワークのロードバランサー（nginx）経由で呼ぶ。Kong は経由しない（二重の中継を避ける）
  host: "lb"
  port: "9080"
  basePath: "/bank/api"
  user: "svc-mule"
  # 1 回の呼び出しの上限（ミリ秒）
  responseTimeout: "15000"

zengin:
  # 当行の銀行コード（被仕向データのうち、これ以外宛てのデータは取り込まない）
  ourBankCode: "9999"
  # 勘定系の被仕向入金 API に 1 回で送る件数（API 側の上限 100）
  chunkSize: "100"

runs:
  # 実行履歴の保持件数
  keep: "50"
