# OpenTelemetry Collector：Kong・MuleSoft のトレース（OTLP/HTTP）を受け取り、Jaeger に送る。
# 送信元：Kong（opentelemetry プラグイン。KONG_OTEL_ENDPOINT=http://otel-collector:4318/v1/traces）
#         MuleSoft（OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318）
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}
  # 個人情報を送らない：URL のクエリ・Cookie・Authorization を消す
  attributes/redact:
    actions:
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: url.query, action: delete }

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [otlp/jaeger]
