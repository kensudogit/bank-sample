# Prometheus：Kong（要求数・遅延・上流の死活・利用者別）、MuleSoft（実行結果・勘定系の呼び出し・再試行・再送の再現）、
# トークン発行（発行数・失敗数）を 15 秒ごとに集める。
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kong
    static_configs: [{ targets: ["kong:8100"] }]
  - job_name: mule
    static_configs: [{ targets: ["mule:8081"] }]
  - job_name: auth
    static_configs: [{ targets: ["auth:8080"] }]
  - job_name: agent
    static_configs: [{ targets: ["agent:8090"] }]
