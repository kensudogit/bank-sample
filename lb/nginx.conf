# Load balancer in front of the frontend (Next.js) and API (WebSphere Liberty) instances.
# - Each replica is listed as its own server (Compose names them <project>-<service>-<n>); "resolve" re-reads DNS, so a
#   restarted replica with a new address is picked up. With LIBERTY_REPLICAS / FRONTEND_REPLICAS above 2, add lines.
#   (A single "server frontend:3000 resolve" covers every replica too, but nginx then does not always retry on the
#   other replica when one has just died.)
# - A failed or unhealthy instance is skipped (max_fails / fail_timeout) and the request is retried on the other one.
# - POST requests are also retried on connection errors: every state-changing API call carries an idempotency key,
#   so a retry of a request that did reach the first instance returns the original result instead of running twice.
worker_processes auto;
events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=2s ipv6=off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;

  upstream frontend {
    zone frontend 64k;
    server bank-sample-frontend-1:3000 resolve max_fails=1 fail_timeout=10s;
    server bank-sample-frontend-2:3000 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
  }

  upstream api {
    zone api 64k;
    server bank-sample-liberty-1:9080 resolve max_fails=1 fail_timeout=10s;
    server bank-sample-liberty-2:9080 resolve max_fails=1 fail_timeout=10s;
    keepalive 16;
  }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 1s;
  proxy_read_timeout 30s;
  proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
  proxy_next_upstream_tries 3;
  proxy_next_upstream_timeout 10s;

  # Browser entry point (frontend)
  server {
    listen 3000;
    location / { proxy_pass http://frontend; }
    location = /lb-health { access_log off; return 200 "ok\n"; }
  }

  # API entry point (used by the frontend instances and for direct API access)
  server {
    listen 9080;
    location / { proxy_pass http://api; }
  }
}
