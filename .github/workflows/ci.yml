# CI：push・pull request ごとに、全コンポーネントのテストと構成の検証を行う。
# Railway は main への push で各サービスを自動でビルドする（.railway/ と infra/terraform/railway は構成の管理）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 勘定系（Struts 2 / Java）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - run: gradle --no-daemon test
        working-directory: backend

  frontend:
    name: 画面（Next.js）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  integration-node:
    name: MuleSoft 互換・トークン発行（Node.js）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # mTLS のテストは openssl で一時的な証明書を作る（ubuntu には標準で入っている）
      - run: node --test
        working-directory: integration/mule-compat
      - run: node --test
        working-directory: integration/auth-server

  kong:
    name: Kong の構成（kong config parse・decK lint）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 一時的な秘密情報を作る（このジョブの中だけで使う）
        run: bash integration/scripts/gen-secrets.sh > "$RUNNER_TEMP/ci.env"
      - name: 構成を描画して Kong 自身で検証する
        run: |
          set -a; . "$RUNNER_TEMP/ci.env"; set +a
          docker build -t bank-kong integration/kong
          mkdir -p "$RUNNER_TEMP/kong" && chmod 777 "$RUNNER_TEMP/kong"
          for mode in redis local; do
            redis=""; [ "$mode" = redis ] && redis="-e KONG_REDIS_HOST=redis -e KONG_REDIS_PASSWORD=$REDIS_PASSWORD"
            docker run --rm -v "$RUNNER_TEMP/kong:/out" -e KONG_RENDER_OUT=/out/kong-$mode.yml \
              -e KONG_GATEWAY_SECRET="$BANK_GATEWAY_SECRET" -e KONG_TOKEN_PUBLIC_KEY="$KONG_TOKEN_PUBLIC_KEY" \
              -e KONG_MTLS_CA_CERT="$MTLS_CA_CERT" -e KONG_MTLS_CLIENT_CERT="$KONG_MTLS_CLIENT_CERT" -e KONG_MTLS_CLIENT_KEY="$KONG_MTLS_CLIENT_KEY" \
              $redis --entrypoint sh bank-kong -c '/kong/render-config.sh --render-only && chmod 644 "$KONG_RENDER_OUT" && kong config parse "$KONG_RENDER_OUT"'
          done
      - name: 安全側の約束を decK で確かめる（JWT・iss/aud/roles・ACL・Redis・mTLS・共有シークレット）
        run: docker run --rm -v "$RUNNER_TEMP/kong:/out" -v "$PWD/integration/kong:/rules" kong/deck:v1.43.1 file lint -s /out/kong-redis.yml /rules/deck-rules.yaml
      - name: Entra ID の設定でも描画できる
        run: |
          set -a; . "$RUNNER_TEMP/ci.env"; set +a
          docker run --rm -e AUTH_MODE=entra -e ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 -e KONG_TOKEN_AUDIENCE=api://bank-integration \
            -e KONG_CLIENT_ID_ZENGIN=11111111-1111-1111-1111-111111111111 -e KONG_CLIENT_ID_BILLING=22222222-2222-2222-2222-222222222222 \
            -e KONG_CLIENT_ID_FX=33333333-3333-3333-3333-333333333333 -e KONG_CLIENT_ID_OPS=44444444-4444-4444-4444-444444444444 \
            -e KONG_GATEWAY_SECRET="$BANK_GATEWAY_SECRET" -e KONG_TOKEN_PUBLIC_KEY="$KONG_TOKEN_PUBLIC_KEY" \
            -e KONG_MTLS_CA_CERT="$MTLS_CA_CERT" -e KONG_MTLS_CLIENT_CERT="$KONG_MTLS_CLIENT_CERT" -e KONG_MTLS_CLIENT_KEY="$KONG_MTLS_CLIENT_KEY" \
            --entrypoint sh bank-kong -c '/kong/render-config.sh --render-only && grep -q "login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0" /tmp/kong.yml && kong config parse /tmp/kong.yml'

  specs:
    name: API 仕様・compose・監視の設定
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/integration/mulesoft/bank-integration/src/main/resources/api:/spec" redocly/cli:1.25.15 lint /spec/bank-integration.yaml
      - name: docker compose の構成（監視のプロファイルを含む）
        run: |
          bash integration/scripts/gen-secrets.sh > .env
          printf 'ORACLE_PASSWORD=x\nBANK_DB_PASSWORD=x\nMULE_CORE_PASSWORD=x\n' >> .env
          docker compose --profile observability config -q
          rm .env
      - name: Prometheus の設定と警告のルール
        run: docker run --rm --entrypoint promtool -v "$PWD/observability:/etc/prometheus" prom/prometheus:v3.0.1 check config /etc/prometheus/prometheus.yml

  terraform:
    name: Terraform（Railway）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
        working-directory: infra/terraform/railway
      - run: terraform init -backend=false
        working-directory: infra/terraform/railway
      - run: terraform validate
        working-directory: infra/terraform/railway
